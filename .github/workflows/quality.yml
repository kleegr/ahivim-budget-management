name: Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "codex/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Lint, types, database tests, audit, and build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ahivim
          POSTGRES_PASSWORD: ahivim-test
          POSTGRES_DB: ahivim_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ahivim -d ahivim_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://ahivim:ahivim-test@127.0.0.1:5432/ahivim_test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  browser:
    name: Browser acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ahivim
          POSTGRES_PASSWORD: ahivim-e2e
          POSTGRES_DB: ahivim_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ahivim -d ahivim_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://ahivim:ahivim-e2e@127.0.0.1:5432/ahivim_e2e
      E2E_EXPECTED_DB_HOST: 127.0.0.1
      E2E_CONFIRM_RESET: DROP_DISPOSABLE_E2E_DATABASE
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
